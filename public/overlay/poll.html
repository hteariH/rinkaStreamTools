<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rinkaStreamTools — опрос в чате</title>
  <style>
    /* ===== База: прозрачный фон для Browser Source в OBS ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent; height: 100%; overflow: hidden;
      font-family: "Segoe UI", Roboto, system-ui, sans-serif; color: #fff;
    }

    #app { padding: 10px; }

    .board {
      padding: 16px 20px; max-width: 100%;
      /* Опроса нет — нет и карточки: пустая рамка полстрима висеть не должна. */
      opacity: 0; transform: translateY(-8px);
      transition: opacity .4s ease, transform .4s ease;
    }
    .board.show { opacity: 1; transform: none; }

    .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .caption {
      font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .75;
      white-space: nowrap;
    }
    .caption:empty { display: none; }
    /* Отсчёт заметнее подписи: по нему решают, успевают ли проголосовать. */
    .timer { margin-left: auto; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .timer:empty { display: none; }

    .question { font-size: 22px; font-weight: 800; line-height: 1.25; margin-bottom: 14px; }
    .question:empty { display: none; }

    .options { display: flex; flex-direction: column; gap: 9px; }

    .option { position: relative; padding: 8px 12px; border-radius: 9px; overflow: hidden; }
    /* Полоса — фон варианта, а не отдельный элемент: так число и текст всегда
       читаются поверх неё, чем бы она ни заполнилась. */
    .option__fill {
      position: absolute; inset: 0; width: 0; border-radius: 9px;
      transition: width .45s cubic-bezier(.2, .8, .25, 1);
    }
    .option__row { position: relative; display: flex; align-items: baseline; gap: 10px; }
    .option__key {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
    }
    .option__text { flex: 1; font-size: 17px; font-weight: 600; }
    .option__count { flex: 0 0 auto; font-size: 15px; font-variant-numeric: tabular-nums; opacity: .85; }
    .option__percent { flex: 0 0 auto; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .total { margin-top: 12px; font-size: 13px; opacity: .6; }

    /* ============================================================
       ТЕМА: default — тёмная панель, золото
       ============================================================ */
    #app[data-theme="default"] .board {
      background: rgba(15, 15, 25, .72); border-radius: 16px;
      backdrop-filter: blur(4px); box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
      text-shadow: 0 2px 6px rgba(0, 0, 0, .6);
    }
    #app[data-theme="default"] .caption, #app[data-theme="default"] .timer { color: #ffd54a; }
    #app[data-theme="default"] .option { background: rgba(255, 255, 255, .07); }
    #app[data-theme="default"] .option__fill { background: rgba(255, 213, 74, .3); }
    #app[data-theme="default"] .option__key { background: rgba(255, 213, 74, .25); color: #ffd54a; }
    #app[data-theme="default"] .option--leading .option__fill { background: rgba(124, 252, 124, .32); }
    #app[data-theme="default"] .option--leading .option__percent { color: #7CFC7C; }

    /* ============================================================
       ТЕМА: slim — только текст, без панели
       ============================================================ */
    #app[data-theme="slim"] .board { padding: 0; }
    #app[data-theme="slim"] .board,
    #app[data-theme="slim"] .board * { text-shadow: 0 2px 8px #000; }
    #app[data-theme="slim"] .option { background: rgba(0, 0, 0, .35); }
    #app[data-theme="slim"] .option__fill { background: rgba(255, 255, 255, .22); }
    #app[data-theme="slim"] .option__key { background: rgba(255, 255, 255, .18); }
    #app[data-theme="slim"] .question { font-size: 20px; }
    #app[data-theme="slim"] .option--leading .option__fill { background: rgba(124, 252, 124, .3); }

    /* ============================================================
       ТЕМА: neon — циан по обсидиану, рамка и скан-линии
       ============================================================ */
    #app[data-theme="neon"] .board {
      position: relative;
      background: rgba(4, 10, 16, .8);
      border: 1px solid rgba(80, 230, 255, .5); border-radius: 8px;
      box-shadow: 0 0 22px rgba(0, 200, 255, .28), inset 0 0 22px rgba(0, 180, 255, .12);
      font-family: "Consolas", monospace;
    }
    #app[data-theme="neon"] .board::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 8px;
      background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 4px);
    }
    #app[data-theme="neon"] .caption,
    #app[data-theme="neon"] .timer { color: #8ff0ff; text-shadow: 0 0 12px rgba(80, 230, 255, .8); }
    #app[data-theme="neon"] .question { color: #d9fbff; }
    #app[data-theme="neon"] .option { background: rgba(80, 230, 255, .08); border-radius: 4px; }
    #app[data-theme="neon"] .option__fill { background: rgba(80, 230, 255, .28); border-radius: 4px; }
    #app[data-theme="neon"] .option__key { background: rgba(80, 230, 255, .25); color: #8ff0ff; border-radius: 3px; }
    #app[data-theme="neon"] .option--leading .option__fill { background: rgba(120, 255, 220, .34); }

    /* ============================================================
       ТЕМА: hud — капсула, подпись вразрядку
       ============================================================ */
    #app[data-theme="hud"] .board {
      background: rgba(8, 8, 10, .88); border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 4px 18px rgba(0, 0, 0, .5);
      font-family: "Consolas", monospace;
    }
    #app[data-theme="hud"] .caption { letter-spacing: .3em; }
    #app[data-theme="hud"] .timer { color: #3cdcf0; }
    #app[data-theme="hud"] .option { background: rgba(255, 255, 255, .07); border-radius: 999px; padding: 8px 16px; }
    #app[data-theme="hud"] .option__fill { background: rgba(60, 220, 240, .28); border-radius: 999px; }
    #app[data-theme="hud"] .option__key { background: rgba(60, 220, 240, .25); color: #3cdcf0; border-radius: 999px; }
    #app[data-theme="hud"] .option--leading .option__fill { background: rgba(124, 252, 124, .3); }

    .offline {
      position: fixed; bottom: 6px; right: 12px;
      font-size: 12px; opacity: .5; display: none;
    }
    .offline.show { display: block; }
  </style>
</head>
<body>
  <div id="app" data-theme="default">
    <div class="board" id="board">
      <div class="head">
        <div class="caption" id="caption"></div>
        <div class="timer" id="timer"></div>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="total" id="total"></div>
    </div>
  </div>
  <div class="offline" id="offline">нет связи</div>

  <script src="/i18n.js"></script>
  <script>
    /*
     * Опрос в чате. Слушает /ws/poll.
     *
     * Проценты и ведущего считает сервер: у него голоса, и делить на ноль на
     * странице незачем. Оверлей только рисует — и сам тикает отсчёт между
     * сообщениями, чтобы секунды не прыгали через раз.
     *
     * Отладка:
     *   /poll?demo       — показать пример, ничего не ожидая от сервера
     *   /poll?theme=neon — перебить тему, не трогая настройки
     */
    const el = (id) => document.getElementById(id);
    const app = el("app");
    const THEMES = ["default", "slim", "neon", "hud"];

    const params = new URLSearchParams(location.search);
    const forcedTheme = THEMES.includes(params.get("theme")) ? params.get("theme") : null;

    let state = null;
    let tick = null;

    function render(next) {
      if (!next || next.type !== "poll") return;
      state = next;

      const theme = forcedTheme || (THEMES.includes(next.theme) ? next.theme : "default");
      if (app.dataset.theme !== theme) app.dataset.theme = theme;

      const board = el("board");
      if (!next.visible) {
        board.classList.remove("show");
        stopTimer();
        return;
      }

      el("caption").textContent = next.title || "";
      el("question").innerText = next.question || "";
      el("total").textContent = next.total
        ? t("Голосов: {n}", { n: next.total })
        : t("Голосов пока нет — напиши номер варианта в чат");

      build(next);
      startTimer(next);
      board.classList.add("show");
    }

    function build(next) {
      const box = el("options");
      // Разметка пересобирается только при смене состава: иначе полосы дёргались
      // бы с нуля на каждом обновлении голосов.
      const shape = next.options.map((option) => option.text).join(" ");
      if (box.dataset.shape !== shape) {
        box.dataset.shape = shape;
        box.innerHTML = "";
        next.options.forEach((option, index) => box.appendChild(optionNode(option, index)));
        return;
      }

      next.options.forEach((option, index) => paint(box.children[index], option, next));
    }

    function optionNode(option, index) {
      const node = document.createElement("div");
      node.className = "option";

      const fill = document.createElement("div");
      fill.className = "option__fill";

      const row = document.createElement("div");
      row.className = "option__row";

      const key = document.createElement("span");
      key.className = "option__key";
      key.textContent = String(index + 1);

      const text = document.createElement("span");
      text.className = "option__text";
      // Именно innerText: вариант пишет стример, но через панель — чужой ввод.
      text.innerText = option.text;

      const count = document.createElement("span");
      count.className = "option__count";

      const percent = document.createElement("span");
      percent.className = "option__percent";

      row.append(key, text, count, percent);
      node.append(fill, row);
      return node;
    }

    function paint(node, option, next) {
      if (!node) return;
      node.classList.toggle("option--leading", Boolean(option.leading));
      node.querySelector(".option__fill").style.width = `${option.percent}%`;
      node.querySelector(".option__count").textContent = option.votes ? `${option.votes}` : "";
      node.querySelector(".option__percent").textContent = next.showPercent ? `${option.percent}%` : "";
    }

    /* Отсчёт тикает на странице: сервер шлёт секунды при изменениях, а между
       ними цифра должна идти сама, иначе она застывает до следующего голоса. */
    function startTimer(next) {
      stopTimer();
      if (!next.open) {
        el("timer").textContent = t("голосование закрыто");
        return;
      }
      if (!next.seconds) {
        el("timer").textContent = "";
        return;
      }

      let left = next.seconds;
      const show = () => { el("timer").textContent = t("{n} с", { n: left }); };
      show();
      tick = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          stopTimer();
          el("timer").textContent = t("голосование закрыто");
          return;
        }
        show();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(tick);
      tick = null;
    }

    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/poll`);
      ws.onopen = () => el("offline").classList.remove("show");
      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          i18n.setLang(message.lang);
          render(message);
        } catch {}
      };
      ws.onclose = () => { el("offline").classList.add("show"); setTimeout(connect, 1500); };
      ws.onerror = () => { try { ws.close(); } catch {} };
    }

    if (params.has("demo")) {
      render({
        type: "poll", visible: true, open: true, title: "Опрос", theme: params.get("theme"),
        question: "Во что играем после перерыва?", total: 42, seconds: 25, showPercent: true,
        options: [
          { text: "Doom", votes: 21, percent: 50, leading: false },
          { text: "Factorio", votes: 14, percent: 33, leading: false },
          { text: "Ещё один разговорный", votes: 7, percent: 17, leading: false },
        ],
      });
    } else {
      connect();
    }
  </script>
</body>
</html>
