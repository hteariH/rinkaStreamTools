<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rinkaStreamTools — алерты донатов</title>
  <style>
    /* ===== База: прозрачный фон для Browser Source в OBS ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent; height: 100%; overflow: hidden;
      font-family: "Segoe UI", Roboto, system-ui, sans-serif; color: #fff;
    }

    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }

    .alert {
      max-width: 78vw; padding: 22px 34px; text-align: center;
      background: rgba(15, 15, 25, .78); border-radius: 20px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
      text-shadow: 0 2px 8px rgba(0, 0, 0, .75);
      animation: in .5s cubic-bezier(.2, 1.3, .35, 1) both;
    }
    .alert.out { animation: out .45s ease-in both; }

    /* Гифка над текстом и по центру. Высота ограничена долей экрана, а не
       пикселями: источник в OBS растягивают под сцену, и гифка должна остаться
       картинкой к алерту, а не занять весь кадр. */
    .art {
      display: block; margin: 0 auto 14px;
      max-width: min(52vw, 520px); max-height: 38vh;
      border-radius: 14px;
    }

    .headline { font-size: clamp(24px, 3.4vw, 44px); font-weight: 800; line-height: 1.15; }
    .donor { color: #ffd54a; }
    .amount { color: #7CFC7C; white-space: nowrap; }
    .message {
      margin-top: 12px; font-size: clamp(16px, 2vw, 26px); line-height: 1.35;
      opacity: .92; word-break: break-word;
    }
    .source {
      margin-top: 10px; font-size: 13px; letter-spacing: .14em;
      text-transform: uppercase; opacity: .45;
    }

    /* Тир виден с первого кадра: чем крупнее донат, тем заметнее карточка.
       Размеры и рамка, а не только цвет — на цветном фоне игры цвет теряется. */
    .alert--small { padding: 16px 26px; border: 1px solid rgba(255, 255, 255, .14); }
    .alert--small .headline { font-size: clamp(20px, 2.4vw, 30px); }

    .alert--medium {
      border: 2px solid rgba(255, 213, 74, .55);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .55), 0 0 30px rgba(255, 200, 70, .25);
    }

    .alert--big {
      padding: 30px 46px;
      border: 2px solid rgba(124, 252, 124, .7);
      box-shadow: 0 10px 46px rgba(0, 0, 0, .6), 0 0 46px rgba(124, 252, 124, .35);
    }
    .alert--big .headline { font-size: clamp(30px, 4.2vw, 56px); }
    .alert--big .amount { animation: pop 1.1s ease-out; }
    @keyframes pop {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    /* inline-block, иначе scale не действует на строчный элемент. */
    .amount { display: inline-block; }

    .tier {
      margin-top: 8px; font-size: 12px; letter-spacing: .18em;
      text-transform: uppercase; opacity: .5;
    }

    /* ============================================================
       ТЕМЫ. Тир задаёт размер и заметность, тема — вид: одно поверх
       другого, поэтому крупный донат остаётся крупным в любой теме.
       ============================================================ */

    /* slim — только текст, без панели */
    .alert[data-theme="slim"] {
      background: none; box-shadow: none; border: none; backdrop-filter: none;
      padding: 6px 10px;
    }
    .alert[data-theme="slim"],
    .alert[data-theme="slim"] * { text-shadow: 0 2px 10px #000, 0 0 3px #000; }

    /* neon — циан по обсидиану, рамка и скан-линии */
    .alert[data-theme="neon"] {
      position: relative; border-radius: 8px;
      background: rgba(4, 10, 16, .82);
      border: 1px solid rgba(80, 230, 255, .55);
      box-shadow: 0 0 26px rgba(0, 200, 255, .3), inset 0 0 26px rgba(0, 180, 255, .12);
      font-family: "Consolas", monospace;
    }
    .alert[data-theme="neon"]::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 8px;
      background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 4px);
    }
    .alert[data-theme="neon"] .donor { color: #8ff0ff; text-shadow: 0 0 14px rgba(80, 230, 255, .8); }
    .alert[data-theme="neon"] .amount { color: #6ff0ff; text-shadow: 0 0 16px rgba(80, 230, 255, .9); }
    .alert[data-theme="neon"] .art { border-radius: 4px; }

    /* hud — капсула, подпись вразрядку */
    .alert[data-theme="hud"] {
      background: rgba(8, 8, 10, .9); border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
      font-family: "Consolas", monospace;
    }
    .alert[data-theme="hud"] .donor { color: #fff; letter-spacing: .04em; }
    .alert[data-theme="hud"] .amount { color: #3cdcf0; text-shadow: 0 0 14px rgba(60, 220, 240, .6); }
    .alert[data-theme="hud"] .art { border-radius: 999px; max-height: 26vh; }

    @keyframes in {
      from { opacity: 0; transform: translateY(28px) scale(.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-18px) scale(.96); }
    }

    .offline {
      position: fixed; bottom: 8px; right: 12px;
      font-size: 12px; opacity: .5; display: none;
    }
    .offline.show { display: block; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="offline" id="offline">нет связи</div>

  <script>
    /*
     * Оверлей алертов. Слушает /ws/alerts и показывает донаты по одному.
     *
     * Гифку, звук и тему выбирает сервер — у него лежит папка media/ и списки
     * файлов по тирам. Оверлею приезжает уже готовое: одно имя картинки, одно
     * имя звука и название темы.
     *
     * Общий звук на все алерты: файл public/alert.mp3 рядом с оверлеями. Он
     * играет, когда у тира своих звуков не выбрано. Нет и его — алерт просто
     * молчит, ошибки в консоли не будет.
     *
     * Отладка:
     *   /alerts?demo       — показать пример, ничего не ожидая от сервера
     *   /alerts?theme=neon — перебить тему, не трогая настройки
     */
    const SOUND_URL = "/alert.mp3";
    // Насколько алерт готов задержаться ради длинного сообщения.
    const VOICE_MAX_MS = 30000;
    const THEMES = ["default", "slim", "neon", "hud"];
    const GAP_MS = 400;

    const stage = document.getElementById("stage");
    const params = new URLSearchParams(location.search);

    const forcedTheme = THEMES.includes(params.get("theme")) ? params.get("theme") : null;

    const queue = [];
    let playing = false;

    // Есть ли файл со звуком, говорит сервер при подключении: сам оверлей за ним
    // не ходит, иначе каждый запуск писал бы 404 в консоль браузера и в лог OBS.
    let hasSound = false;

    function node(tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      // Именно innerText: имя и сообщение донатера — чужой ввод.
      if (value !== undefined) element.innerText = value;
      return element;
    }

    function fmtAmount(data) {
      const amount = Number(data.amount);
      if (!Number.isFinite(amount)) return "";
      const rounded = Number.isInteger(amount) ? amount : amount.toFixed(2);
      return `${rounded} ${data.currency || ""}`.trim();
    }

    const SOURCES = { donationAlerts: "DonationAlerts", donatello: "Donatello" };

    /** Файл из медиатеки: имя в адресе кодируется — там бывают пробелы и кириллица. */
    function mediaUrl(name) {
      return "/media/" + encodeURIComponent(name);
    }

    /**
     * Озвучка сообщения. Приезжает готовым mp3 по адресу от сервера — синтез уже
     * случился, и оверлею остаётся только сыграть.
     *
     * Голос запускается после звукового эффекта, а не вместе с ним: одновременно
     * их не разобрать, а эффект короткий.
     */
    function playVoice(data, after) {
      if (!data.voice) return null;

      const voice = new Audio(data.voice);
      const start = () => voice.play().catch(() => { /* автовоспроизведение запретили */ });
      if (after) {
        after.addEventListener("ended", start, { once: true });
        // Эффекта может не оказаться (файл убрали) — тогда ended не придёт вовсе.
        after.addEventListener("error", start, { once: true });
      } else {
        start();
      }
      return voice;
    }

    function playSound(data) {
      // Свой звук тира важнее общего: общий — это «хоть что-нибудь», а выбранный
      // руками относится к конкретному тиру.
      const url = data.sound ? mediaUrl(data.sound) : (hasSound ? SOUND_URL : null);
      if (!url) return null;

      const audio = new Audio(url);
      const volume = Number(data.volume);
      audio.volume = Number.isFinite(volume) ? Math.min(1, Math.max(0, volume)) : 0.8;
      audio.play().catch(() => { /* автовоспроизведение запретили — алерт всё равно виден */ });
      return audio;
    }

    function show(data) {
      const card = node("div", `alert alert--${data.tier || "small"}`);
      card.dataset.theme = forcedTheme || (THEMES.includes(data.theme) ? data.theme : "default");

      // Картинка первой: пока грузится, текст уже на месте и не прыгает.
      if (data.image) {
        const art = node("img", "art");
        art.src = mediaUrl(data.image);
        art.alt = "";
        // Файл могли убрать из папки между выбором и показом — тогда просто
        // остаётся текстовый алерт, а не рамка от битой картинки в кадре.
        art.addEventListener("error", () => art.remove());
        card.appendChild(art);
      }

      const headline = node("div", "headline");
      headline.appendChild(node("span", "donor", data.donorName || "Аноним"));
      headline.appendChild(document.createTextNode(" — "));
      headline.appendChild(node("span", "amount", fmtAmount(data)));
      card.appendChild(headline);

      if (data.message) card.appendChild(node("div", "message", data.message));

      const source = SOURCES[data.source] || data.source || "";
      card.appendChild(node("div", "source", source));
      if (data.tierName) card.appendChild(node("div", "tier", data.tierName));

      stage.innerHTML = "";
      stage.appendChild(card);

      const effect = playSound(data);
      const voice = playVoice(data, effect);

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        card.classList.add("out");
        setTimeout(() => {
          stage.innerHTML = "";
          playing = false;
          playNext();
        }, GAP_MS);
      };

      const duration = Number(data.durationMs) || 7000;
      setTimeout(() => {
        // Сообщение длиннее, чем висит карточка: убирать её из-под голоса нельзя —
        // зритель дослушивает то, чего уже не видно.
        if (voice && !voice.ended && !voice.error) {
          voice.addEventListener("ended", finish, { once: true });
          voice.addEventListener("error", finish, { once: true });
          // Если звук завис на чужой стороне, алерт всё равно уйдёт: очередь
          // донатов не должна вставать из-за одного.
          setTimeout(finish, VOICE_MAX_MS);
          return;
        }
        finish();
      }, duration);
    }

    /* Донаты во время эфира идут пачками, поэтому показываем строго по одному. */
    function playNext() {
      if (playing || queue.length === 0) return;
      playing = true;
      show(queue.shift());
    }

    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/alerts`);
      ws.onopen = () => document.getElementById("offline").classList.remove("show");
      ws.onmessage = (ev) => {
        let message;
        try { message = JSON.parse(ev.data); } catch { return; }
        if (message.type === "hello") { hasSound = Boolean(message.sound); return; }
        if (message.type !== "alert") return;
        queue.push(message);
        playNext();
      };
      ws.onclose = () => {
        document.getElementById("offline").classList.add("show");
        setTimeout(connect, 1500);
      };
      ws.onerror = () => { try { ws.close(); } catch {} };
    }

    if (params.has("demo")) {
      // Прогон всех тиров подряд — посмотреть, чем они отличаются на экране.
      const demo = [
        { tier: "small", tierName: "Мелкий", amount: 2, durationMs: 4000 },
        { tier: "medium", tierName: "Средний", amount: 10, durationMs: 4000 },
        { tier: "big", tierName: "Крупный", amount: 50, durationMs: 4000 },
      ];
      for (const item of demo) {
        queue.push({
          type: "alert", source: "donationAlerts", donorName: "Тестовый зритель",
          currency: "USD", message: "проверка оверлея", ...item,
        });
      }
      playNext();
    } else {
      connect();
    }
  </script>
</body>
</html>
