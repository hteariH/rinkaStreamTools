name: Релиз

# Собирает папку для раздачи и вешает её архивом на релиз.
# Запуск: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  # Прогнать сборку без тега — проверить, что всё ещё собирается.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Кеш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      - name: Тесты
        run: npm test

      # Окно панели собирается первым: build:exe кладёт готовый бинарник в dist,
      # а не собирает его сам.
      - name: Сборка приложения
        run: cargo build --release
        working-directory: desktop

      - name: Сборка сервера и раскладка папки
        run: npm run build:exe

      - name: Проверка раскладки
        shell: pwsh
        run: |
          $missing = @(
            'dist/rinkaStreamTools.exe',
            'dist/server/rinkaStreamTools-server.exe',
            'dist/server/public/index.html',
            'dist/server/public/overlay/screamer.js',
            'dist/server/src/nowplaying/session.ps1'
          ) | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "не собралось: $($missing -join ', ')" }

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath rinkaStreamTools-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rinkaStreamTools-win-x64
          path: rinkaStreamTools-win-x64.zip

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            rinkaStreamTools-win-x64.zip `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
